name = "buddys-concierge-worker"
main = "src/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[vars]
TENANT_ID = "buddys"
RUNTIME_TARGET = "blackhole"
PUBLIC_BASE_URL = "https://buddys-concierge-worker.cryptocapitalgroupfl.workers.dev"
DASHBOARD_URL = "https://buddys-dashboard-worker.cryptocapitalgroupfl.workers.dev"
DOCUSIGN_BASE_PATH = "https://demo.docusign.net/restapi"
DOCUSIGN_RETURN_URL = "https://buddys-concierge-worker.cryptocapitalgroupfl.workers.dev"
DOCUSIGN_SELECTION_CUTOFF_MS = "1786309440000"
BUDDY_LIVE_SOURCE = "image-url"
BUDDY_AVATAR_IMAGE_URL = "https://buddys-4nm.pages.dev/buddys/images/buddy-avatar.jpg"
BUDDY_LEMONSLICE_AGENT_ID = "agent_9f9ee92bbcec14c3"
BUDDY_VIDEO_VOICE_PROVIDER = "livekit-inference"
BUDDY_VIDEO_VOICE_MODEL = "xai/tts-1"
BUDDY_VIDEO_VOICE_ID = "leo"
BUDDY_RUNTIME_URL = "https://buddy-voice.xyz-labs.xyz"
BUDDY_AVATAR_PROMPT = "Use friendly, attentive upper-body movement and natural hand gestures while speaking."

[[d1_databases]]
binding = "DB"
database_name = "buddys-message-track-db"
database_id = "34ef42d7-ccef-4ba4-b57c-ecabc5ad8f81"

[[services]]
binding = "SMS"
service = "buddys-sms-worker"

[[services]]
binding = "EMAIL"
service = "buddys-email-worker"

[[services]]
binding = "VOICE"
service = "buddys-voice-worker"

# Buddy remains independently deployable. The concierge is its tenant adapter
# and consumes the existing shared video runtime contract, matching EILA OS and
# AI Fans without coupling this repository to another product repository.
[[services]]
binding = "VIDEO"
service = "blackhole-video-worker"

[[queues.producers]]
binding = "EVENTS"
queue = "buddys-communication-events"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "buddys_message_events"

[observability]
enabled = true
head_sampling_rate = 1

# Match the proven AI Fans adapter contract exactly: this worker receives a
# standard encrypted Worker secret named BLACKHOLE_CAPABILITY_TOKEN. It must
# contain the same broker capability value used by the working AI Fans adapter.
# Configure it with:
#   npx wrangler secret put BLACKHOLE_CAPABILITY_TOKEN --config apps/blackhole-concierge-worker/wrangler.toml

[secrets]
required = ["INTERNAL_CALL_SECRET"]
