# Cloudflare Module Worker configuration
# API/webhook surface runs on edge. Background jobs run via Queue consumer.

name = "buddys-dashboard-worker"
main = "worker-entry.mjs"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
APP_VERSION = "pass-6-edge"
NODE_ENV = "production"
LOG_LEVEL = "info"
LOG_FORMAT = "json"
DB_BACKEND = "d1"
RUNTIME_TARGET = "edge"
# Set CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD and OPERATOR_ROLES_JSON in the
# deployment environment before enabling operator access. Unconfigured = denied.
ALLOWED_ORIGINS = "https://buddys.pages.dev,https://buddys-4nm.pages.dev"

# --- Dashboard D1 Database ---
[[d1_databases]]
binding = "DB"
database_name = "buddys-dashboard-db"
database_id = "__BUDDYS_DASHBOARD_DB_ID__"

# Authoritative Buddy workflow/session state written by buddys-concierge-worker.
[[d1_databases]]
binding = "BUDDY_DB"
database_name = "buddys-message-track-db"
database_id = "__BUDDYS_MESSAGE_TRACK_DB_ID__"

# --- Queues ---
# Dashboard produces Buddy-specific follow-up jobs.
[[queues.producers]]
queue = "buddys-followup-jobs"
binding = "FOLLOWUP_QUEUE"

# Campaign sends and automated follow-ups are processed by this Worker's queue() handler.
[[queues.consumers]]
queue = "buddys-followup-jobs"
max_batch_size = 20
max_retries = 3

# Voice/concierge communication telemetry, used for transcripts and activity history.
[[queues.consumers]]
queue = "buddys-communication-events"
max_batch_size = 20
max_retries = 3

# --- Development overrides ---
[env.dev]
name = "buddys-dashboard-worker-dev"

[env.dev.vars]
APP_VERSION = "pass-6-edge-dev"
NODE_ENV = "development"
LOG_LEVEL = "debug"
LOG_FORMAT = "text"
DB_BACKEND = "memory"

[[services]]
binding = "CONCIERGE"
service = "buddys-concierge-worker"

[[services]]
binding = "ASSISTANT"
service = "buddys-assistant-adapter"

[observability]
enabled = true
head_sampling_rate = 1

[secrets]
required = ["INTERNAL_CALL_SECRET"]
