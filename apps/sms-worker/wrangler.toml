name = "buddys-sms-worker"
main = "src/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
binding = "EVENTS"
queue = "buddys-communication-events"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true

[secrets]
required = ["INTERNAL_CALL_SECRET", "TWILIO_PHONE_NUMBER"]

# Existing account bundle; values are resolved asynchronously per request.
[[secrets_store_secrets]]
binding = "TWILIO_ACCOUNT_SID"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_TWILIO_ACCOUNT_SID"

[[secrets_store_secrets]]
binding = "TWILIO_AUTH_TOKEN"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_TWILIO_AUTH_TOKEN"
