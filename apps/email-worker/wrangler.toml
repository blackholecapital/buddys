name = "buddys-email-worker"
main = "src/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
binding = "EVENTS"
queue = "buddys-communication-events"

[observability]
enabled = true
head_sampling_rate = 1

[secrets]
required = ["INTERNAL_CALL_SECRET"]

# Existing account bundle; values are resolved asynchronously per request.
[[secrets_store_secrets]]
binding = "RESEND_API_KEY"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_RESEND_API_KEY"
