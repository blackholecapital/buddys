name = "buddys-email-worker"
main = "src/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
binding = "EVENTS"
queue = "buddys-communication-events"

[observability]
enabled = true
head_sampling_rate = 1

[secrets]
required = ["INTERNAL_CALL_SECRET", "RESEND_API_KEY"]
