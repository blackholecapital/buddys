name = "buddys-voice-worker"
main = "src/index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_BASE_URL = "https://buddys-voice-worker.cryptocapitalgroupfl.workers.dev"
MEDIA_STREAM_URL = "wss://buddys-voice-worker.cryptocapitalgroupfl.workers.dev/twilio/media"
DEEPGRAM_STT_MODEL = "nova-3"
DEEPGRAM_ENDPOINTING_MS = "300"
BUDDY_RUNTIME_URL = "https://alley-voice.xyz-labs.xyz"
BUDDY_OPENAI_TTS_MODEL = "gpt-4o-mini-tts"
BUDDY_OPENAI_TTS_VOICE = "cedar"
BUDDY_OPENAI_TTS_SPEED = "1.0"

[[services]]
binding = "CONCIERGE"
service = "buddys-concierge-worker"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true

[secrets]
required = ["INTERNAL_CALL_SECRET", "TWILIO_PHONE_NUMBER", "BUDDY_RUNTIME_TOKEN"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[[queues.producers]]
binding = "EVENTS"
queue = "buddys-communication-events"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "buddys_voice_events"

# Existing account bundle; values are resolved asynchronously per request.
[[secrets_store_secrets]]
binding = "TWILIO_ACCOUNT_SID"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_TWILIO_ACCOUNT_SID"

[[secrets_store_secrets]]
binding = "TWILIO_AUTH_TOKEN"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_TWILIO_AUTH_TOKEN"

[[secrets_store_secrets]]
binding = "DEEPGRAM_API_KEY"
store_id = "00b34d29f2c94685b0f250dc5b1ee875"
secret_name = "XYZ_DEMO_DEEPGRAM_API_KEY"
